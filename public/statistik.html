<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistik - SuntikPanel</title>
<link rel="stylesheet" href="style.css">
<style>
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-box { background: #fff; border-radius: 14px; padding: 16px; border-left: 4px solid #2563eb; }
.stat-box.green { border-left-color: #10b981; }
.stat-box.orange { border-left-color: #f59e0b; }
.stat-box.purple { border-left-color: #a855f7; }
.stat-box small { display: block; font-size: 10px; color: #7a8a9a; font-weight: 700; letter-spacing: .5px; margin-bottom: 6px; text-transform: uppercase; }
.stat-box b { font-size: 20px; font-weight: 800; color: #1a2a3a; display: block; }
.stat-box .sub { font-size: 10px; color: #8a9aaa; margin-top: 2px; }
.chart-card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
.chart-card h4 { font-size: 13px; font-weight: 800; margin-bottom: 14px; color: #1a2a3a; }
.chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-bottom: 24px; position: relative; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; position: relative; }
.bar { width: 100%; background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%); border-radius: 6px 6px 0 0; min-height: 4px; }
.bar-label { position: absolute; bottom: -20px; font-size: 9px; color: #8a9aaa; font-weight: 700; }
.bar-value { font-size: 10px; color: #2563eb; font-weight: 800; margin-bottom: 4px; }
.platform-list-stat { display: flex; flex-direction: column; gap: 10px; }
.platform-stat { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #f7faff; border-radius: 12px; }
.ps-left { display: flex; align-items: center; gap: 10px; }
.ps-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 6px; }
.ps-icon svg { width: 100%; height: 100%; }
.ps-tiktok { background: #f0f0f3; }
.ps-instagram { background: #fff; border: 1px solid #f0e0e8; }
.ps-facebook { background: #e8f0fd; }
.ps-left b { font-size: 13px; font-weight: 800; }
.ps-right { font-size: 14px; font-weight: 800; color: #2563eb; }
.empty-stat { text-align: center; padding: 40px 20px; color: #9aa8b6; font-size: 12px; background: #fff; border-radius: 16px; }
body.dark-mode .stat-box, body.dark-mode .chart-card { background: #1a2332; }
body.dark-mode .stat-box b, body.dark-mode .chart-card h4 { color: #e8eef7; }
body.dark-mode .platform-stat { background: #0f1420; }
body.dark-mode .ps-left b { color: #e8eef7; }
body.dark-mode .empty-stat { background: #1a2332; }
</style>
</head>
<body>

<div class="top-header">
  <div class="brand">
    <img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none'">
    <div class="brand-text">
      <h1>Statistik Saya</h1>
      <small id="userGreet">SuntikPanel</small>
    </div>
  </div>
  <div class="header-actions">
    <button type="button" class="btn-theme" onclick="toggleTheme()"><span id="themeIcon">☾</span></button>
    <a href="/menu.html" class="btn-menu">MENU</a>
  </div>
</div>

<a href="/" class="btn-back">← Kembali ke Beranda</a>

<div class="stat-grid">
  <div class="stat-box"><small>Total Order</small><b id="statTotalOrder">0</b><div class="sub" id="statPendingOrder">0 pending</div></div>
  <div class="stat-box orange"><small>Total Belanja</small><b id="statSpent">Rp0</b><div class="sub">dari order kamu</div></div>
  <div class="stat-box green"><small>Total Deposit</small><b id="statDeposit">Rp0</b><div class="sub">saldo terisi</div></div>
  <div class="stat-box purple"><small>Order Selesai</small><b id="statPaid">0</b><div class="sub">berhasil</div></div>
</div>

<div class="chart-card"><h4>Order 7 Hari Terakhir</h4><div class="chart-bars" id="chartBars"></div></div>

<div class="chart-card">
  <h4>Order per Platform</h4>
  <div class="platform-list-stat" id="platformStats"><div class="empty-stat">Belum ada data</div></div>
</div>

<div class="footer">
  <p><b>SuntikPanel</b> &middot; 2025</p>
</div>

<script src="app.js"></script>
<script>
const user = JSON.parse(localStorage.getItem('user') || 'null');
if (!user) location.href = '/login.html';

function formatRp(n) { return 'Rp ' + (n || 0).toLocaleString('id-ID'); }

setTimeout(function() {
  const icon = document.getElementById('themeIcon');
  const theme = localStorage.getItem('theme') || 'light';
  if (icon) icon.textContent = theme === 'dark' ? '☀' : '☾';
}, 50);

async function loadStats() {
  try {
    const res = await fetch('/api/user/' + user.whatsapp + '/stats');
    const data = await res.json();
    if (!data.success) return;
    const s = data.stats;
    document.getElementById('statTotalOrder').textContent = s.totalOrder;
    document.getElementById('statPendingOrder').textContent = s.totalPending + ' pending';
    document.getElementById('statSpent').textContent = formatRp(s.totalSpent);
    document.getElementById('statDeposit').textContent = formatRp(s.totalDeposit);
    document.getElementById('statPaid').textContent = s.totalPaid;

    const chart = document.getElementById('chartBars');
    chart.innerHTML = '';
    const maxCount = Math.max(1, ...s.last7.map(d => d.count));
    s.last7.forEach(d => {
      const height = (d.count / maxCount) * 100;
      const col = document.createElement('div');
      col.className = 'bar-col';
      col.innerHTML = '<div class="bar-value">' + d.count + '</div>' +
        '<div class="bar" style="height:' + height + '%"></div>' +
        '<div class="bar-label">' + d.date + '</div>';
      chart.appendChild(col);
    });

    const plat = document.getElementById('platformStats');
    if (Object.keys(s.byPlatform).length === 0) {
      plat.innerHTML = '<div class="empty-stat">Belum ada data</div>';
    } else {
      plat.innerHTML = '';
      const icons = {
        tiktok: '<svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43V8.69a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.12z" fill="#000"/></svg>',
        instagram: '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5.5" fill="url(#ig3)"/><circle cx="12" cy="12" r="4.2" stroke="#fff" stroke-width="1.8" fill="none"/><circle cx="17.6" cy="6.4" r="1.2" fill="#fff"/><defs><linearGradient id="ig3" x1="0" y1="24" x2="24" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FEDA75"/><stop offset="0.3" stop-color="#FA7E1E"/><stop offset="0.55" stop-color="#D62976"/><stop offset="0.8" stop-color="#962FBF"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs></svg>',
        facebook: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1877F2"/><path d="M15.5 12.5h-2.3V20h-3v-7.5H8.6v-2.6h1.6V8.4c0-1.8 1-2.9 2.9-2.9.9 0 1.7.1 1.9.1v2.2h-1.3c-.9 0-1.1.4-1.1 1v1.1h2.4l-.5 2.6z" fill="#fff"/></svg>'
      };
      Object.entries(s.byPlatform).forEach(([p, count]) => {
        const div = document.createElement('div');
        div.className = 'platform-stat';
        div.innerHTML = '<div class="ps-left"><div class="ps-icon ps-' + p + '">' + (icons[p] || '') + '</div><b>' + p.charAt(0).toUpperCase() + p.slice(1) + '</b></div><div class="ps-right">' + count + ' order</div>';
        plat.appendChild(div);
      });
    }
  } catch (err) { console.error(err); }
}
loadStats();
</script>
</body>
</html>
