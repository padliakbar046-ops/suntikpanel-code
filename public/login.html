<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - SuntikPanel</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
body {
  background: linear-gradient(160deg, #2563eb 0%, #1e40af 50%, #0f2554 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.login-wrap { width: 100%; max-width: 400px; }
.login-logo { text-align: center; margin-bottom: 22px; }
.login-logo img {
  width: 90px; height: 90px; border-radius: 22px;
  background: #fff; padding: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.login-logo h1 {
  color: #fff; font-size: 22px; font-weight: 800;
  margin-top: 14px; letter-spacing: -.3px;
}
.login-logo p { color: rgba(255,255,255,.7); font-size: 12px; margin-top: 4px; }
.login-card {
  background: #fff; border-radius: 22px; padding: 24px 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
.tab-row {
  display: flex; background: #eef3f8; border-radius: 14px;
  padding: 4px; margin-bottom: 22px;
}
.tab {
  flex: 1; text-align: center; padding: 10px;
  font-size: 13px; font-weight: 800; color: #7a8a9a;
  border-radius: 10px; cursor: pointer; transition: all .2s;
}
.tab.active {
  background: #2563eb; color: #fff;
  box-shadow: 0 4px 10px rgba(37,99,235,.35);
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.form-row { margin-bottom: 14px; }
.form-row label {
  display: block; font-size: 11px; color: #4a5a6a;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 6px;
}
.form-row input {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid #dbe6f2; background: #f7faff;
  color: #1a2a3a; font-size: 14px;
}
.form-row input:focus { outline: none; border-color: #2563eb; background: #fff; }
.btn-login {
  width: 100%; padding: 15px; background: #2563eb; color: #fff;
  border: none; border-radius: 14px; font-weight: 800;
  font-size: 14px; cursor: pointer; margin-top: 6px; letter-spacing: .3px;
}
.btn-login:hover { background: #1e40af; }
.btn-login:disabled { opacity: .6; cursor: not-allowed; }
.msg {
  font-size: 12px; padding: 10px 14px; border-radius: 10px;
  margin-bottom: 14px; display: none;
}
.msg.error { background: #fee2e2; color: #991b1b; display: block; }
.msg.success { background: #d1fae5; color: #065f46; display: block; }
.bottom-links {
  text-align: center; margin-top: 16px;
  font-size: 12px; color: #7a8a9a;
  display: flex; justify-content: space-around;
}
.bottom-links a { color: #2563eb; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    <h1>SuntikPanel</h1>
    <p>Layanan Suntik Sosial Media</p>
  </div>

  <div class="login-card">
    <div class="tab-row">
      <div class="tab active" onclick="switchTab('login')">Masuk</div>
      <div class="tab" onclick="switchTab('register')">Daftar</div>
    </div>

    <div id="msg" class="msg"></div>

    <div id="tab-login" class="tab-content active">
      <div class="form-row">
        <label>Nomor WhatsApp</label>
        <input type="tel" id="login-wa" placeholder="08xxxxxxxxxx">
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" id="login-pw" placeholder="Password kamu">
      </div>
      <button class="btn-login" id="btnLogin" onclick="doLogin()">Masuk</button>
    </div>

    <div id="tab-register" class="tab-content">
      <div class="form-row">
        <label>Nama</label>
        <input type="text" id="reg-nama" placeholder="Nama kamu">
      </div>
      <div class="form-row">
        <label>Nomor WhatsApp</label>
        <input type="tel" id="reg-wa" placeholder="08xxxxxxxxxx">
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" id="reg-pw" placeholder="Minimal 4 karakter">
      </div>
      <button class="btn-login" id="btnRegister" onclick="doRegister()">Daftar</button>
    </div>

    <div class="bottom-links">
      <a href="/landing.html">Beranda</a>
      <a href="/status.html">Status Server</a>
    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (tab === 'login') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('tab-login').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('tab-register').classList.add('active');
  }
  hideMsg();
}
function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg ' + type;
}
function hideMsg() { document.getElementById('msg').className = 'msg'; }

async function doLogin() {
  hideMsg();
  const wa = document.getElementById('login-wa').value.trim();
  const pw = document.getElementById('login-pw').value;
  if (!wa || !pw) { showMsg('Isi nomor WhatsApp dan password', 'error'); return; }
  const btn = document.getElementById('btnLogin');
  btn.textContent = 'Memproses...'; btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ whatsapp: wa, password: pw })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    localStorage.setItem('user', JSON.stringify(data.user));
    showMsg('Login berhasil, mengalihkan...', 'success');
    setTimeout(() => location.href = '/', 800);
  } catch (err) {
    showMsg(err.message, 'error');
    btn.textContent = 'Masuk'; btn.disabled = false;
  }
}

async function doRegister() {
  hideMsg();
  const nama = document.getElementById('reg-nama').value.trim();
  const wa = document.getElementById('reg-wa').value.trim();
  const pw = document.getElementById('reg-pw').value;
  if (!nama || !wa || !pw) { showMsg('Isi semua data', 'error'); return; }
  const btn = document.getElementById('btnRegister');
  btn.textContent = 'Memproses...'; btn.disabled = true;
  try {
    const res = await fetch('/api/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nama, whatsapp: wa, password: pw })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    localStorage.setItem('user', JSON.stringify(data.user));
    showMsg('Registrasi berhasil, mengalihkan...', 'success');
    setTimeout(() => location.href = '/', 800);
  } catch (err) {
    showMsg(err.message, 'error');
    btn.textContent = 'Daftar'; btn.disabled = false;
  }
}

// Cek hash #register
if (location.hash === '#register') switchTab('register');
</script>
</body>
</html>
