<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - SuntikPanel</title>
<link rel="stylesheet" href="style.css">
<style>
.menu-page {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}
.menu-page a {
  background: #fff;
  padding: 18px 20px;
  border-radius: 14px;
  text-decoration: none;
  color: #1a2a3a;
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(30,60,120,.06);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: transform .15s;
}
.menu-page a:active { transform: scale(.98); }
.menu-page a.danger { color: #dc2626; }
.menu-page .arrow { color: #b0bcc8; font-size: 22px; font-weight: 700; }
</style>
</head>
<body>

<div class="top-header">
  <div class="brand">
    <img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none'">
    <div class="brand-text">
      <h1>Menu</h1>
      <small>SuntikPanel</small>
    </div>
  </div>
  <a href="/" class="btn-menu">KEMBALI</a>
</div>

<div class="menu-page">
  <a href="/">Beranda <span class="arrow">›</span></a>
  <a href="/statistik.html">Statistik <span class="arrow">›</span></a>
  <a href="/riwayat.html">Riwayat Order <span class="arrow">›</span></a>
  <a href="/tiket.html">Tiket Komplain <span class="arrow">›</span></a>
  <a href="/status.html">Status Server <span class="arrow">›</span></a>
  <a href="/landing.html">Halaman Publik <span class="arrow">›</span></a>
  <a href="#" class="danger" onclick="logout(event)">Keluar <span class="arrow">›</span></a>
</div>

<script>
function logout(e) {
  e.preventDefault();
  if (confirm('Yakin ingin keluar?')) {
    localStorage.removeItem('user');
    localStorage.removeItem('pendingDeposit');
    location.href = '/login.html';
  }
}
</script>

</body>
</html>
